<body class="art-body" data-page="work">

<header class="nav" id="nav">
  <a class="brand" href="../#top" aria-label="Meadow home">
    <svg viewBox="0 0 5 5" aria-hidden="true"><rect x="0" y="0" width="1" height="1"/><rect x="4" y="0" width="1" height="1"/><rect x="0" y="1" width="1" height="1"/><rect x="1" y="1" width="1" height="1"/><rect x="3" y="1" width="1" height="1"/><rect x="4" y="1" width="1" height="1"/><rect x="2" y="2" width="1" height="1"/><rect x="1" y="3" width="1" height="1"/><rect x="3" y="3" width="1" height="1"/><rect x="0" y="4" width="1" height="1"/><rect x="4" y="4" width="1" height="1"/></svg>
    Meadow
  </a>
  <nav class="links" id="links">
    <a href="./" aria-current="page">Art</a>
    <a href="../#how">How it works</a>
    <a href="../#idea">The idea</a>
    <a href="../#explore">Explore</a>
    <a href="../#contact">Contact</a>
  </nav>
  <a class="btn btn-dark" href="../#login">Log in</a>
  <button class="menu" id="menu" aria-label="Open menu" aria-expanded="false" aria-controls="links">
    <span></span><span></span>
  </button>
</header>

<main class="art-main" id="workRoot">
  <div class="work-grid" data-reveal>
    <div class="work-media" id="workMedia"></div>
    <div class="work-info">
      <p class="eyebrow" id="workArtist"></p>
      <h1 id="workTitle"></h1>
      <p class="meta" id="workMeta"></p>

      <div class="numbers">
        <div>
          <p class="label">last sale</p>
          <p class="big" id="lastSale"></p>
        </div>
        <div>
          <p class="label">indexed est.</p>
          <p class="big" id="estNow"></p>
          <div id="estReason"></div>
        </div>
      </div>

      <div class="chart-wrap" id="chartWrap">
        <canvas id="workChart" height="240"></canvas>
      </div>

      <div id="salesTable"></div>

      <a id="wikiLink" class="btn btn-outline" target="_blank" rel="noopener">Read more</a>
    </div>
  </div>
</main>

<footer class="art-footer" id="artFooter"></footer>

<script src="art.js"></script>
</body>
