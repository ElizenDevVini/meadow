<body class="art-body" data-page="work">

<header class="nav" id="nav">

    Meadow
  </a>
  <nav class="links" id="links">
    <a href="./" aria-current="page">Art</a>
    <a href="../#how">How it works</a>
    <a href="../#idea">The idea</a>
    <a href="../#explore">Explore</a>
    <a href="../#contact">Contact</a>
    <a class="nav-x" href="https://x.com/meadowrwa" target="_blank" rel="noopener" aria-label="Meadow on X"><svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24h-6.66l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg></a>

  <button class="btn btn-outline wallet-btn" id="walletBtn" type="button">connect wallet</button>
  <a class="btn btn-dark" href="../#login">Log in</a>
  <button class="menu" id="menu" aria-label="Open menu" aria-expanded="false" aria-controls="links">
    <span></span><span></span>
  </button>
  <div class="wallet-picker" id="walletPicker" hidden></div>
</header>

<main class="art-main" id="workRoot">
  <div class="work-grid" data-reveal>
    <div class="work-media" id="workMedia"></div>
    <div class="work-info">
      <p class="eyebrow" id="workArtist"></p>
      <h1 id="workTitle"></h1>
      <p class="meta" id="workMeta"></p>

      <div class="valuation">
        <p class="worth-label">worth</p>
        <p class="worth-figure" id="worthFigure"></p>
        <p class="worth-sub" id="worthSub"></p>
        <div id="worthEst"></div>
      </div>

      <div class="chart-wrap" id="chartWrap">
        <canvas id="workChart" height="240"></canvas>
      </div>

      <div id="salesTable"></div>

      <a id="wikiLink" class="btn btn-outline" target="_blank" rel="noopener">Read more</a>

      <div class="panel buy-panel" id="buyPanel">
        <div class="titlebar" aria-hidden="true"><span></span><span>ownership</span></div>
        <div class="panel-body" id="buyPanelBody"></div>
      </div>
    </div>
  </div>
</main>

<footer class="art-footer" id="artFooter"></footer>

<script src="art.js"></script>
<script type="module" src="onchain.js"></script>
</body>
</html>
